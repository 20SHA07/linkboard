<!doctype html><html lang="en" data-mode="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a page | Linkboard</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/site.css"><script type="module" src="/site.mjs"></script><script type="module" src="/report.mjs"></script></head><body><header class="site-nav"><a class="wordmark" href="/"><span>↗</span>linkboard.</a><div class="nav-actions"><select data-site-mode aria-label="Colour mode"><option value="system">◐ System</option><option value="light">☀ Light</option><option value="dark">☾ Dark</option></select><a href="/app">Your workspace ↗</a></div></header><main class="document"><p class="eyebrow">LINKBOARD / COMMUNITY</p><h1>Report a page</h1><p>Tell the site owner about spam, impersonation, or harmful content on a Linkboard page. Don’t include passwords or private information.</p><form id="report-form"><label for="report-slug">Page address</label><input id="report-slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" minlength="2" maxlength="48" required placeholder="The part after /p/, such as qmc"><label for="report-reason">What’s the issue?</label><textarea id="report-reason" minlength="20" maxlength="1000" required placeholder="Describe the issue in 20 to 1,000 characters."></textarea><button class="button" type="submit">Send report ↗</button></form><p id="report-status" role="alert"></p></main></body></html>
